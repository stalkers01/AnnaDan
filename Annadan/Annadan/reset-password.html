<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | Annadan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="register-page">
    <main class="register-card">
        <a class="register-logo" href="index.html"><span>Annadan</span></a>
        <h1>Reset your password</h1>
        <p class="register-intro">Request a one-time code by email, then choose a new password.</p>
        <form id="forgot-form" class="account-form">
            <label for="reset-email">Email address</label>
            <input id="reset-email" name="email" type="email" autocomplete="email" required>
            <button type="submit">Send reset code</button>
        </form>
        <form id="reset-form" class="account-form">
            <label for="reset-code">Six-digit reset code</label>
            <input id="reset-code" name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
            <label for="new-password">New password</label>
            <input id="new-password" name="new_password" type="password" minlength="10" autocomplete="new-password" required>
            <button type="submit">Update password</button>
        </form>
        <p id="reset-message" class="register-message" role="status" aria-live="polite"></p>
        <a class="back-home" href="login.html">Return to sign in</a>
    </main>
    <script src="js/api.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
