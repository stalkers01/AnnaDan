services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: annadan
      POSTGRES_USER: annadan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - annadan_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annadan -d annadan"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://annadan:${POSTGRES_PASSWORD}@database:5432/annadan
      ENVIRONMENT: production
      REQUIRE_EMAIL_VERIFICATION: "false"
      REQUIRE_SAFETY_REVIEW: "false"
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  annadan_postgres:
