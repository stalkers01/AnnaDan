
services:
  - type: web
    name: annadan-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: annadan-db
          property: connectionString

      - key: CORS_ORIGINS
        value: '["https://annadan-sepia.vercel.app"]'

      - key: FRONTEND_BASE_URL
        value: https://annadan-sepia.vercel.app

      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"

      - key: REQUIRE_PHONE_VERIFICATION
        value: "false"

      - key: REQUIRE_SAFETY_REVIEW
        value: "true"

      - key: EXPOSE_OTP_IN_DEVELOPMENT
        value: "false"

databases:
  - name: annadan-db
    databaseName: annadan
    user: annadan_app
    region: singapore
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
