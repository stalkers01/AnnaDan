<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Annadan</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="register-page">
    <main class="register-card">
        <a class="register-logo" href="index.html">
            <i class="fa-solid fa-hand-holding-heart"></i>
            <span>Annadan</span>
        </a>

        <h1>Create your account</h1>
        <p class="register-intro">Join your community and help good food reach people who need it.</p>

        <form id="register-form">
            <label for="full-name">Full name</label>
            <input id="full-name" name="fullName" type="text"
                placeholder="Your name" autocomplete="name" required>

            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                placeholder="you@example.com" autocomplete="email" required>

            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel"
                placeholder="Your phone number" autocomplete="tel" required>

            <label for="role">I want to join as</label>
            <select id="role" name="role" required>
                <option value="">Choose a role</option>
                <option value="donor">Food donor</option>
                <option value="receiver">NGO, shelter or food receiver</option>
                <option value="delivery_partner">Delivery partner</option>
            </select>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                placeholder="At least 10 characters" autocomplete="new-password"
                minlength="10" required>

            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirmPassword" type="password"
                placeholder="Type your password again" autocomplete="new-password" required>

            <button type="submit">Create account</button>
        </form>

        <p id="register-message" class="register-message" role="status" aria-live="polite"></p>
        <a class="back-home" href="login.html">Already have an account? Sign in</a><br>
        <a class="back-home" href="index.html">← Back to home</a>
    </main>

    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
